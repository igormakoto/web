<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café - Contato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="min-vh-100 overflow-x-hidden">

    <nav class="navbar navbar-expand-md navbar-cafe fixed-top px-5 w-100">
        <div class="container-fluid px-0">

            <a href="index.html" class="navbar-brand fs-1 fw-bold">Café</a>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu lateral que desliza da direita no celular -->
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">

                <div class="offcanvas-header border-bottom border-secondary">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
                </div>

                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 align-items-start align-items-md-center">
                        <li class="nav-item ms-md-4 mb-3 mb-md-0">
                            <a href="index.html" class="nav-link fs-5 fw-medium pb-1">Home</a>
                        </li>
                        <li class="nav-item ms-md-4 mb-3 mb-md-0">
                            <a href="sobre.html" class="nav-link fs-5 fw-medium pb-1">Sobre</a>
                        </li>
                        <li class="nav-item ms-md-4 mb-3 mb-md-0">
                            <a href="contato.html" class="nav-link fs-5 fw-medium pb-1 active">Contato</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </nav>

    <section class="d-flex justify-content-center align-items-center min-vh-100 px-5" style="padding-top: 90px;">
        <div class="form-contato text-center w-100">
            <span class="fs-4 d-block mb-2 destaque">FALE CONOSCO</span>
            <h1 class="display-5 fw-bold lh-base mb-4">Entre em Contato</h1>

            <form class="d-flex flex-column gap-3 text-start">
                <div>
                    <label for="nome" class="form-label text-secondary">Seu nome</label>
                    <input type="text" id="nome" class="form-control bg-dark text-white border-secondary" placeholder="Digite seu nome" required>
                </div>
                <div>
                    <label for="email" class="form-label text-secondary">Seu e-mail</label>
                    <input type="email" id="email" class="form-control bg-dark text-white border-secondary" placeholder="exemplo@email.com" required>
                </div>
                <div>
                    <label for="mensagem" class="form-label text-secondary">Sua mensagem</label>
                    <textarea id="mensagem" class="form-control bg-dark text-white border-secondary" rows="4" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </div>
                <button type="submit" class="btn btn-cafe fw-bold mt-2 py-2">Enviar Mensagem</button>
            </form>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
