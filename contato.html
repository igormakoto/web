<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café - Contato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="contato.css">
</head>
<body class="text-white min-vh-100 overflow-x-hidden" style="background-color: #121212;">

    <nav class="navbar navbar-expand-md fixed-top px-5 w-100" style="background-color: #121212; top: 0; z-index: 1050;">
        <div class="container-fluid px-0">

            <a href="index.html" class="navbar-brand fs-1 fw-bold" style="color: #C88A58; transition: 0.5s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">Café</a>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>

            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel" style="background-color: #121212 !important;">

                <div class="offcanvas-header border-bottom border-secondary">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel" style="color: #C88A58;">Menu</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
                </div>

                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 align-items-start align-items-md-center">
                        <li class="nav-item ms-md-4 mb-3 mb-md-0">
                            <a href="index.html" class="nav-link fs-5 fw-medium text-white pb-1"
                               style="border-bottom: 3px solid transparent; transition: 0.3s;"
                               onmouseover="this.style.color='#C88A58'; this.style.borderBottomColor='#C88A58'"
                               onmouseout="this.style.color='white'; this.style.borderBottomColor='transparent'">Home</a>
                        </li>
                        <li class="nav-item ms-md-4 mb-3 mb-md-0">
                            <a href="sobre.html" class="nav-link fs-5 fw-medium text-white pb-1"
                               style="border-bottom: 3px solid transparent; transition: 0.3s;"
                               onmouseover="this.style.color='#C88A58'; this.style.borderBottomColor='#C88A58'"
                               onmouseout="this.style.color='white'; this.style.borderBottomColor='transparent'">Sobre</a>
                        </li>
                        <li class="nav-item ms-md-4 mb-3 mb-md-0">
                            <a href="contato.html" class="nav-link fs-5 fw-medium pb-1 active" style="color: #C88A58 !important; border-bottom: 3px solid #C88A58;">Contato</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </nav>

    <section class="home" style="padding-top: 90px;">

        <div class="home-content">
            <h2>Entre em Contato</h2>

            <form>
                <input type="text" placeholder="Seu nome" required>
                <input type="email" placeholder="Seu e-mail" required>
                <textarea placeholder="Sua mensagem" required></textarea>
                <button type="submit">Enviar</button>
            </form>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
